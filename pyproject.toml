[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analyst"
version = "0.1.0"
description = "Chat agent for retail executives to analyse sales data (LangGraph + Gemini + BigQuery)"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
retail-analyst = "retail_analyst.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]
